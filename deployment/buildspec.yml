version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-1"
    MEDISCAN_ECR_REPO: "615299768302.dkr.ecr.ap-south-1.amazonaws.com/mediscan-app"
    # S3 bucket & keys for your .env files:
    S3_ENV_BUCKET: "secure-env-files-itsoftlab"
    PRODUCTION_ENV_KEY: "mediscan-production-env.env"
    STAGING_ENV_KEY:    "mediscan-staging-env.env"

phases:
  pre_build:
    commands:
      - set -e # Stop execution on failure

      - echo "🔹 Checking Docker status..."
      - docker info

      - echo "🔹 Logging into AWS ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $MEDISCAN_ECR_REPO

      - echo "🔹 Determining which .env file to fetch from S3..."
      - |
        if [ "$ENVIRONMENT" = "production" ]; then
          ENV_KEY="$PRODUCTION_ENV_KEY"
        else
          ENV_KEY="$STAGING_ENV_KEY"
        fi
        echo "→ Will fetch s3://$S3_ENV_BUCKET/$ENV_KEY"

      - echo "🔹 Downloading .env from S3..."
      - aws s3 cp "s3://$S3_ENV_BUCKET/$ENV_KEY" ./app.env --region $AWS_DEFAULT_REGION
      - chmod 600 ./app.env

      - echo "🔹 Exporting NEXT_PUBLIC_* vars"
      - |
        for VAR in NEXT_PUBLIC_URL NEXT_PUBLIC_WEB_NAME \
                   NEXT_PUBLIC_WEB_MODE NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME \
                   NEXT_PUBLIC_CLOUDINARY_API_KEY NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET \
                   NEXT_PUBLIC_RAZORPAY_ID; do
          # Get the value from the .env file and export it
          VAR_VALUE=$(grep -E "^$VAR=" app.env | cut -d'=' -f2-)
          eval export $VAR="$VAR_VALUE"
        done

  build:
    commands:
      - set -e

      - echo "🔹 Building Docker image with NEXT_PUBLIC_* args..."
      - |
        docker build \
          --build-arg NEXT_PUBLIC_URL="$NEXT_PUBLIC_URL" \
          --build-arg NEXT_PUBLIC_APP_VERSION="$NEXT_PUBLIC_APP_VERSION" \
          --build-arg NEXT_PUBLIC_WEB_NAME="$NEXT_PUBLIC_WEB_NAME" \
          --build-arg NEXT_PUBLIC_WEB_MODE="$NEXT_PUBLIC_WEB_MODE" \
          --build-arg NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME="$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" \
          --build-arg NEXT_PUBLIC_CLOUDINARY_API_KEY="$NEXT_PUBLIC_CLOUDINARY_API_KEY" \
          --build-arg NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET="$NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET" \
          --build-arg NEXT_PUBLIC_RAZORPAY_ID="$NEXT_PUBLIC_RAZORPAY_ID" \
          --build-arg TAG_NAME="$TAG_NAME" \
          --build-arg NODE_ENV="$ENVIRONMENT" \
          -t "$APP_TAG" -f ./Dockerfile .

  post_build:
    commands:
      - set -e

      - echo "🔹 Tagging and pushing Docker image..."
      - docker tag "$APP_TAG" "$MEDISCAN_ECR_REPO:$APP_TAG"
      - docker push "$MEDISCAN_ECR_REPO:$APP_TAG"

artifacts:
  files:
    - imagedefinitions.json
